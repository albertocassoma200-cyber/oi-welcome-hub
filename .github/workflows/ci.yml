name: Verificações da aplicação

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Formatação, lint, testes e build
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar Bun
        uses: oven-sh/setup-bun@v2
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Formatar ficheiros da loja
        run: bunx prettier --write src/lib/supabase.ts src/routes/admin.tsx src/routes/index.tsx src/lib/store-catalog.ts src/test/store-catalog.test.ts src/routes/__root.tsx
      - name: Registar formatação
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/supabase.ts src/routes/admin.tsx src/routes/index.tsx src/lib/store-catalog.ts src/test/store-catalog.test.ts
            git commit -m "Format storefront and administration code"
            git push
          fi
      - name: Verificar lint
        run: bun run lint
      - name: Executar testes
        run: bun run test
      - name: Criar build de produção
        run: bun run build
